name: Smoke test Cloudflare preview
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live-http:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live Cloudflare endpoints
        env:
          SITE_URL: https://yolong.bournelong511.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SITE_URL;
          async function fetchStable(url,options={}) {
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const result=await fetch(url,{...options,signal:AbortSignal.timeout(20000)});
                if(result.status<500 || attempt===3)return result;
              }catch(error){
                if(attempt===3)throw error;
                console.log('HTTP_RETRY',attempt,String(error).slice(0,120));
              }
              await new Promise(resolve=>setTimeout(resolve,attempt*400));
            }
          }
          const paths = ['/', '/zh/', '/en/', '/journal/zh/', '/security/en/', '/assets/styles.css', '/assets/editorial.css', '/assets/transition.css', '/assets/media/brand/raven-original-4x-3240.webp', '/assets/app.js', '/content/site.json', '/content/security-zh.json', '/content/security-en.json', '/content/research-zh.json', '/security/zh/2026-11-17-001/', '/security/en/2026-11-17-001/', '/journal/zh/bla-strategy-analysis/', '/journal/en/pakistan-drc-mining-comparison/', '/about/zh/', '/experience/en/', '/contact/zh/', '/training/zh/', '/training/en/01/', '/training/zh/11/', '/content/pages-zh.json', '/content/pages-en.json', '/content/training-zh.json', '/content/training-en.json', '/content/capabilities-zh.json', '/content/capabilities-en.json', '/capabilities/zh/', '/capabilities/en/', '/capabilities/zh/security-architecture/', '/capabilities/en/security-governance/'];
          const failed = [];
          for (const path of paths) {
            try {
              const response = await fetchStable(base + path, {signal: AbortSignal.timeout(20000)});
              const body = await response.text();
              const type = response.headers.get('content-type') || '';
              console.log(response.status, path, type, 'bytes=' + body.length, 'resolved=' + response.url);
              if (path.endsWith('/assets/app.js')) {
                const nativeLinks=body.includes('function activeUrl(target)') && body.includes('href="'+"'"+'+activeUrl(\'en\')');
                console.log('LIVE_NATIVE_LANGUAGE_LINKS:',nativeLinks);
                if (!nativeLinks) failed.push('Deployed JavaScript is older than latest repository commit');
              }
              if (!response.ok) { failed.push(path + ' HTTP ' + response.status); continue; }
              if (path.endsWith('/') && new URL(response.url).pathname !== path) failed.push(path + ' unexpectedly redirected to ' + new URL(response.url).pathname);
              if (path.endsWith('.css') && !path.endsWith('transition.css') && !body.includes('.hero')) failed.push(path + ' CSS missing');
              if (path.endsWith('transition.css') && !body.includes('grid-template-columns')) failed.push(path + ' horizontal brand lockup missing');
              if (path.endsWith('raven-original-4x-3240.webp') && (!type.includes('image/webp') || body.length < 50000)) failed.push(path + ' high-resolution image missing or unexpectedly small');
              if (path.endsWith('editorial.css') && !body.includes('.editorial-hero')) failed.push(path + ' editorial design missing');
              if (path.endsWith('.js') && !body.includes('function bind')) failed.push(path + ' JS missing');
              if (path.endsWith('.json')) {
                try { const data = JSON.parse(body); if (path.endsWith('site.json') && (!data.sections?.zh || !data.sections?.en)) failed.push(path + ' data invalid');
                if (path.includes('security-') && data.events?.length < 125) failed.push(path + ' archive count regressed');
                if (path.includes('research-') && !data.articles?.length) failed.push(path + ' research count invalid');
                if (path.includes('pages-') && data.pages?.length !== 4) failed.push(path + ' site pages count invalid');
                if (path.includes('training-') && data.modules?.length !== 11) failed.push(path + ' training module count invalid');
                if (path.includes('capabilities-') && (data.items?.length !== 5 || data.items.some(x=>!x.approach?.length))) failed.push(path + ' security capabilities incomplete'); }
                catch { failed.push(path + ' not JSON'); }
              }
              if (!path.includes('/assets/') && !path.endsWith('.json') && (!body.includes('id="app"') || !body.includes('/assets/app.js'))) failed.push(path + ' app shell missing');
            } catch (error) {
              failed.push(path + ' ' + String(error));
              console.log('ERROR', path, String(error));
            }
          }
          const brand=await fetchStable(base+'/assets/media/brand/raven-mark-light.png');
          console.log('RAVEN_BRAND_ASSET',brand.status,brand.headers.get('content-type'));
          if(!brand.ok||!String(brand.headers.get('content-type')).includes('image/png')) failed.push('Local RAVEN brand mark unavailable');
          const media=await fetchStable(base+'/content/media-map.json').then(r=>r.json()).catch(()=>null);
          if(!media?.branding?.mark)failed.push('Local media mapping missing');
          // Verify original logo, preserved SVG figures, and image manifest are actually served.
          const mediaResponse=await fetchStable(base+'/content/media-map.json',{signal:AbortSignal.timeout(20000)});
          if(!mediaResponse.ok)failed.push('Missing permanent media manifest');
          else {
            const media=await mediaResponse.json();
            const references=Object.values(media.images||{});
            const candidates=[media.branding?.logo,...references.filter(p=>p.endsWith('.svg')).slice(0,2),...references.filter(p=>p.endsWith('.png')).slice(0,2),...references.filter(p=>p.endsWith('.webp')).slice(-3)].filter(Boolean);
            if(references.length<194)failed.push('Preserved original media reference count regressed: '+references.length);
            for(const path of [...new Set(candidates)]){
              const response=await fetchStable(base+path,{signal:AbortSignal.timeout(20000)});
              const type=response.headers.get('content-type')||'';
              console.log('MEDIA_HTTP',response.status,path,type);
              if(!response.ok || !type.startsWith('image/'))failed.push('Local image missing: '+path);
            }
          }
          // Verify the original research PDF archive is served independently of Notion.
          const pdfManifestResponse=await fetchStable(base+'/content/journal-attachments.json');
          if(!pdfManifestResponse.ok)failed.push('Missing journal PDF manifest');
          else {
            const pdfManifest=await pdfManifestResponse.json();
            if(pdfManifest.publications?.length!==9)failed.push('Original research PDF inventory is incomplete');
            for(const publication of pdfManifest.publications||[]){
              try{
                const response=await fetchStable(base+publication.path,{headers:{Range:'bytes=0-7'}});
                const start=Buffer.from(await response.arrayBuffer()).subarray(0,5).toString('utf8');
                console.log('ORIGINAL_PDF_HTTP',response.status,publication.order,publication.id,start);
                if(!response.ok||start!=='%PDF-')failed.push('Original PDF unavailable: '+publication.id);
              }catch(error){failed.push('Original PDF fetch failed: '+publication.id+' '+String(error))}
            }
          }
          const oldPage='/p/2f83102210ef8055896fcecd3254a5a6';
          const redirect=await fetchStable(base+oldPage,{redirect:'manual'});
          const locationHeader=redirect.headers.get('location')||'';
          console.log('LEGACY_REDIRECT:',redirect.status,oldPage,'to',locationHeader);
          if (redirect.status!==301 || !locationHeader.includes('/zh/')) failed.push('Legacy Notion homepage redirect failed');
          if (failed.length) {
            console.error('Live smoke test failed:', failed.join('; '));
            process.exitCode = 1;
          } else {
            console.log('All live Cloudflare endpoints responded with expected content.');
          }
          NODE
      - name: Confirm latest About narrative is actually published
        run: |
          node --input-type=module <<'NODE'
          const origin='https://yolong.bournelong511.workers.dev';
          const cases=[
            {lang:'zh',closing:'我的角色，是在既有假设失效、后果真实存在的环境中，帮助组织持续运作。'},
            {lang:'en',closing:'My role is to help organisations keep operating when assumptions break down and the consequences are real.'}
          ];
          for(const {lang,closing} of cases){
            const url=origin+'/content/pages-'+lang+'.json';
            let verified=false;
            for(let attempt=1;attempt<=16;attempt++){
              const res=await fetch(url+'?about_rev=09758965-'+attempt,{cache:'no-store',headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
              const raw=await res.text();
              let page=null;
              try{page=JSON.parse(raw).pages.find(p=>p.slug==='about')?.presentation;}catch{}
              const photo=page?.chapters||[];
              verified=page?.closing===closing &&
                page?.heroArtwork==='/assets/media/editorial/about-hero-portrait-2026.webp' &&
                photo[0]?.artwork==='/assets/media/editorial/about-field-original-2026.webp' &&
                photo[1]?.artwork==='/assets/media/editorial/about-security-original-2026.webp';
              console.log('ABOUT_LIVE',lang,'attempt',attempt,'status',res.status,'current',verified,
                'closing',JSON.stringify(page?.closing||''),'heroArtwork',JSON.stringify(page?.heroArtwork||''),
                'etag',res.headers.get('etag'),'cf-cache',res.headers.get('cf-cache-status'));
              if(verified)break;
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            if(!verified)throw Error('LIVE ABOUT STALE: '+lang+' is still serving old content');
          }
          NODE
  diagnose-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect public DNS and live site identity
        run: |
          node --input-type=module <<'NODE'
          import { promises as dns } from 'node:dns';
          for(const host of ['ravenlong.com','www.ravenlong.com']){
            for(const [label, fn] of [['NS',dns.resolveNs],['CNAME',dns.resolveCname],['A',dns.resolve4]]){
              try{console.log('DNS',host,label,JSON.stringify(await fn(host)));}
              catch(e){console.log('DNS',host,label,e.code||String(e));}
            }
          }
          for(const url of ['https://www.ravenlong.com/','https://www.ravenlong.com/content/site.json','https://www.ravenlong.com/zh/','https://www.ravenlong.com/sitemap.xml','https://yolong.bournelong511.workers.dev/zh/']){
            try{
              const res=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(15000)});
              const body=(await res.text()).slice(0,25000);
              console.log('WEB',JSON.stringify({
                url,
                status:res.status,
                location:res.headers.get('location'),
                cfRay:res.headers.get('cf-ray'),
                server:res.headers.get('server'),
                contentType:res.headers.get('content-type'),
                contentLen:body.length,
                title:(body.match(/<title[^>]*>([^<]*)/i)||[])[1]||'',
                hasNewApp:body.includes('id="app"'),
                hasNotion:/(external\.notion\.site|notion\.site|NotionSite|notioncdn)/i.test(body),
                hasSitemap:body.includes('<urlset'),
                first:body.slice(0,140)
              }));
            }catch(e){console.log('WEB',url,String(e).slice(0,200));}
          }
          NODE
