name: Import original RAVEN media
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raven-media-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser to access public original image
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture original branded logo from the public website
        run: node scripts/import-logo-browser.mjs
      - name: Verify mirrored logo and map
        run: |
          test -s assets/media/brand/raven-logo-web.webp
          test -s content/media-map.json
      - name: Commit permanent logo copy
        run: |
          git config user.name 'raven-media-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/media-map.json assets/media/
          if git diff --cached --quiet; then
            echo 'Original branded media already preserved'
          else
            git commit -m "assets: preserve original RAVEN logo outside Notion"
            git push origin HEAD:main
          fi
