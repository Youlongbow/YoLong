name: Design Lab acceptance
on:
  push:
    branches: [main]
    paths:
      - 'assets/security-lab.js'
      - 'assets/security-lab-quizzes.js'
      - 'assets/security-system-study.js'
      - 'assets/security-industry-exercises.js'
      - 'assets/app.js'
      - 'assets/share.js'
      - 'scripts/build.mjs'
      - 'scripts/seo.mjs'
      - 'scripts/test-lab.mjs'
      - 'scripts/test-lab-people.mjs'
      - '.github/workflows/design-lab.yml'
  workflow_dispatch:
jobs:
  local-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module --check < assets/security-lab.js
          node --input-type=module --check < assets/security-lab-quizzes.js
          node --input-type=module --check < assets/security-system-study.js
          node --input-type=module --check < assets/security-industry-exercises.js
      - run: node scripts/build.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise bilingual editor and native WebGL pixel output in Chromium
        env:
          LAB_CAPTURE_DIR: lab-visual-review
          LAB_REQUIRE_GPU: '1'
        run: |
          node scripts/test-lab.mjs
          node scripts/test-lab-people.mjs
      - name: Preserve visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-visual-review
          path: lab-visual-review
          if-no-files-found: warn
          retention-days: 14
  live-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published localized routes and exact renderer revision
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const digest=b=>createHash('sha256').update(b).digest('hex').slice(0,12);
          const expected=digest(readFileSync('assets/security-lab.js'));
          const origins=['https://www.ravenlong.com','https://yolong.bournelong511.workers.dev'];
          const langs=['zh','en'];
          const fetchBytes=async(url)=>{
            const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'},signal:AbortSignal.timeout(12000)});
            if(!r.ok)throw Error('HTTP '+r.status+' '+url);
            return {bytes:Buffer.from(await r.arrayBuffer()),cache:r.headers.get('cf-cache-status')||'-',age:r.headers.get('age')||'-',etag:r.headers.get('etag')||'-'};
          };
          // Direct expected-asset probes distinguish old route HTML from missing deployed artifacts.
          async function releaseProbe(origin,nonce){
            const out={origin,expected};
            for(const [key,path] of [['manifest','/content/lab-release.json'],['expectedAsset','/assets/security-lab.'+expected+'.js'],['stableApp','/assets/app.js']]){
              try{
                const x=await fetchBytes(origin+path+'?labcheck='+nonce);
                out[key]={hash:digest(x.bytes),cache:x.cache,age:x.age};
                if(key==='manifest')out[key].release=JSON.parse(x.bytes.toString('utf8'));
                if(key==='stableApp')out[key].renderer=x.bytes.toString('utf8').match(/security-lab\.([a-f0-9]{12})\.js/)?.[1]||null;
              }catch(e){out[key]={error:String(e)}}
            }
            console.log('LAB RELEASE PROBE',JSON.stringify(out));
          }
          await Promise.all(origins.map(origin=>releaseProbe(origin,process.env.GITHUB_RUN_ID+'-initial')));
          let last=[];
          for(let attempt=1;attempt<=48;attempt++){
            const nonce=process.env.GITHUB_RUN_ID+'-'+attempt+'-'+Date.now();
            const result=await Promise.all(origins.flatMap(origin=>langs.map(async lang=>{
              try{
                const page=await fetchBytes(origin+'/lab/'+lang+'/?labcheck='+nonce);
                const html=page.bytes.toString('utf8'),app=html.match(/src="(\/assets\/app\.[a-f0-9]{12}\.js)"/)?.[1];
                if(!app||!html.includes('/lab/'+lang+'/'))throw Error('Missing localized route metadata');
                const code=await fetchBytes(origin+app+'?labcheck='+nonce);
                const actual=code.bytes.toString('utf8').match(/security-lab\.([a-f0-9]{12})\.js/)?.[1];
                if(!actual)throw Error('Missing versioned renderer import');
                const renderer=await fetchBytes(origin+'/assets/security-lab.'+actual+'.js?labcheck='+nonce);
                const bodyHash=digest(renderer.bytes);
                return {origin,lang,app,actual,bodyHash,expected,cache:page.cache,age:page.age,etag:page.etag,pass:actual===expected&&bodyHash===expected};
              }catch(e){return{origin,lang,expected,error:String(e),pass:false}}
            })));
            last=result;
            for(const item of result)console.log('LAB LIVE OBSERVATION',JSON.stringify(item));
            if(result.every(x=>x.pass)){
              console.log('LAB LIVE PASS ALL HOSTS AND LANGUAGES',expected);
              process.exit(0);
            }
            // Distinguish a newer main revision from an actual stale or corrupted deployment.
            // An old workflow never passes on the strength of a different renderer.
            if(attempt%4===0){
              try{
                execFileSync('git',['fetch','--depth=1','origin','main'],{stdio:'pipe'});
                const latest=digest(execFileSync('git',['show','FETCH_HEAD:assets/security-lab.js']));
                if(latest!==expected&&result.every(x=>x.actual===latest&&x.bodyHash===latest)){
                  console.log('LAB LIVE SUPERSEDED: checked renderer',expected,'current main renderer',latest,'is live on all routes');
                  throw Error('Original revision superseded; use current-main acceptance run');
                }
                console.log('LAB LIVE MAIN HASH',latest,'CHECKED HASH',expected);
              }catch(e){console.log('LAB LIVE REVISION DIAGNOSTIC',String(e));if(String(e).includes('Original revision superseded'))throw e}
            }
            await new Promise(r=>setTimeout(r,5000));
          }
          await Promise.all(origins.map(origin=>releaseProbe(origin,process.env.GITHUB_RUN_ID+'-final')));
          throw Error('Lab publication not verified: '+JSON.stringify(last));
          NODE
