name: Probe public legacy site media
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect legacy website's rendered media
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            for(const url of ['https://www.ravenlong.com/','https://www.ravenlong.com/p/2f83102210ef8055896fcecd3254a5a6']){
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(6000);
                const info=await page.evaluate(()=>({title:document.title,headings:[...document.querySelectorAll('h1,h2')].slice(0,5).map(e=>e.textContent.slice(0,70)),images:[...document.images].slice(0,12).map(e=>({alt:e.alt,src:e.currentSrc.split('?')[0].slice(0,240),complete:e.complete,width:e.naturalWidth,height:e.naturalHeight}))}));
                console.log('RENDERED_LEGACY:',JSON.stringify({url,status:response?.status(),info}).slice(0,5500));
              }catch(e){console.log('RENDERED_LEGACY_ERROR:',url,String(e).slice(0,320))}
            }
          } finally{await browser.close()}
          NODE
