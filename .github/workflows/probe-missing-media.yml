name: Diagnose outstanding original illustrations
on:
  push:
    paths:
      - '.github/workflows/probe-missing-media.yml'
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/probe-missing-media.mjs
