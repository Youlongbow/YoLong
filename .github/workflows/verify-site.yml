name: Verify RAVEN website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < assets/app.js
      - name: Check bilingual publisher transaction rules
        run: node scripts/test-publish.mjs
      - name: Build static website
        run: node scripts/build.mjs
      - name: Check permanent media archive and missing-asset inventory
        run: node scripts/verify-media.mjs
      - name: Validate preview distribution
        run: |
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/app.js
          test -s dist/content/site.json
          test -s dist/en/index.html
          test -s dist/zh/index.html
          test -s dist/security/en/index.html
          test -s dist/security/zh/index.html
          test -s dist/journal/en/index.html
          test -s dist/journal/zh/index.html
          test -s dist/security/zh/2026-11-17-001/index.html
          test -s dist/security/en/2026-11-17-001/index.html
          test -s dist/journal/zh/bla-strategy-analysis/index.html
          test -s dist/journal/en/pakistan-drc-mining-comparison/index.html
          test -s dist/about/zh/index.html
          test -s dist/about/en/index.html
          test -s dist/experience/zh/index.html
          test -s dist/contact/en/index.html
          test -s dist/training/zh/index.html
          test -s dist/training/en/01/index.html
          test -s dist/training/zh/11/index.html
          node -e "for(const lang of ['zh','en']){const d=require('./content/training-'+lang+'.json');if(d.modules.length!==11||d.modules.some(x=>x.body.length<1000))process.exit(1)}"
          test -s dist/media-manifest.json
          test -s dist/assets/transition.css
          test -s dist/content/capabilities-zh.json
          test -s dist/content/capabilities-en.json
          test -s dist/capabilities/zh/index.html
          test -s dist/capabilities/en/index.html
          test -s dist/capabilities/zh/security-architecture/index.html
          test -s dist/capabilities/en/security-architecture/index.html
          test -s dist/capabilities/zh/security-governance/index.html
          node -e "for(const l of ['zh','en']){const c=require('./content/capabilities-'+l+'.json').items;if(c.length!==5||c.some(x=>!x.summary||x.approach.length<3))process.exit(1)}"
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          grep -q 'https://www.ravenlong.com/about/zh/' dist/sitemap.xml
          grep -q 'Allow: /' dist/robots.txt
          grep -q 'Sitemap: https://www.ravenlong.com/sitemap.xml' dist/robots.txt
          grep -q 'rel="canonical"' dist/about/zh/index.html
          grep -q 'hreflang="en"' dist/about/zh/index.html
          grep -q 'application/ld+json' dist/journal/zh/bla-strategy-analysis/index.html
          grep -q 'mailto:' dist/assets/app.js
          node -e "const zh=require('./content/security-zh.json').events,en=require('./content/security-en.json').events;if(zh.length<125||zh.length!==en.length||zh.some((r,i)=>r.slug!==en[i].slug||r.date!==en[i].date))process.exit(1)"
          node -e "const d=require('./dist/content/site.json');if(!d.sections.zh||!d.sections.en||d.events.length<4)process.exit(1)"
