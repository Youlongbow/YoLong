name: Archive original RAVEN research PDF files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-journal-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raven-pdf-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preserve nine original PDFs from the public journal
        run: node scripts/archive-journal-pdfs.mjs
      - name: Confirm original files
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,statSync} from 'node:fs';
          const p=JSON.parse(readFileSync('content/journal-attachments.json','utf8'));
          for(const a of p.publications)if(statSync(a.path.slice(1)).size<1024)throw Error('Missing PDF '+a.id);
          console.log('ORIGINAL_PDFS_VERIFIED',p.publications.length);
          NODE
      - name: Commit permanent original PDF copies
        run: |
          git config user.name 'raven-media-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/publications/
          if ! git diff --cached --quiet; then
            git commit -m "assets: archive original RAVEN research PDF publications"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
