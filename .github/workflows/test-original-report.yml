name: Validate migrated original 86-page report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-original-report.yml'
  workflow_dispatch:
jobs:
  original-report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/test-original-report.mjs
