name: Pilot original PDF publication transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-pdf.yml'
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify one original PDF transfer
        run: node scripts/pilot-journal-attachment.mjs
